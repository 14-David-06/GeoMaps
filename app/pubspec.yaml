name: geomaps
description: "Mapas georreferenciados offline: carga el plano del predio, ubicate en el sin senal, marca y mide"
publish_to: 'none'

version: 0.2.6+10

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Mapa -------------------------------------------------------------
  # flutter_map es raster. Se eligio sobre maplibre_gl porque superponer las
  # capas del usuario (el MBTiles que trajo topografia) sobre el satelite es
  # una linea de codigo, y porque no arrastra binarios nativos por plataforma.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # El mapa offline del usuario: un SQLite con las teselas adentro.
  # TODO(mapas-offline): reactivar al implementar la importacion de MBTiles.
  # flutter_map_mbtiles:
  # mbtiles:

  # "Descargar esta region" del mapa base no necesita paquete aparte: usa la
  # cache que ya trae flutter_map (ver `state/descarga.dart`), la misma de la
  # que el mapa lee sin senal. flutter_map_tile_caching quedo descartado: es
  # GPL y arrastra una base nativa para hacer lo mismo.

  # Reproyeccion. Un plano de topografia colombiano llega en MAGNA-SIRGAS
  # (EPSG:3116, 9377...), no en WGS84.
  proj4dart: ^2.1.0

  # --- Datos ------------------------------------------------------------
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # --- Estado -----------------------------------------------------------
  flutter_riverpod: ^2.6.1

  # --- GPS --------------------------------------------------------------
  geolocator: ^13.0.2
  # Hacia donde mira el telefono estando quieto. El rumbo del GPS sale de dos
  # posiciones seguidas y parado es ruido: sin brujula, la flecha solo aparecia
  # andando y el mapa no podia girar hacia el frente como en un navegador.
  flutter_compass: ^0.8.1

  # --- Red --------------------------------------------------------------
  http: ^1.6.0
  connectivity_plus: ^7.3.1

  # --- Identidad ---------------------------------------------------------
  # Registro abierto con cuenta de Google. No hay SDK de proveedor de identidad:
  # la app obtiene el idToken de Google, lo cambia por un JWT nuestro en el
  # backend, y lo guarda cifrado.
  google_sign_in: ^6.2.2

  # El JWT propio va al Keystore de Android, no a SharedPreferences: un token
  # de 30 dias en texto plano es una sesion prestada a cualquiera que tenga el
  # telefono un minuto.
  flutter_secure_storage: ^9.2.2

  # --- Archivos ----------------------------------------------------------
  # Elegir el PDF que se importa como capa NO usa un paquete: lo hace el canal
  # nativo `geomaps/planos` (android/.../PlanosNativos.kt). `file_selector`
  # carga el archivo entero en memoria y con un plano cartografico de 80 MB la
  # app se cae; `file_picker` ni siquiera compila con esta cadena.
  #
  # 12.x y no 13.x: share_plus 13 pide win32 ^6 y flutter_secure_storage pide
  # win32 ^5. El conflicto es de los plugins de Windows, no de Android, pero pub
  # resuelve para todas las plataformas a la vez.
  share_plus: ^12.0.2

  # --- Entregables -------------------------------------------------------
  # El informe PDF se arma con `pdf`, que es Dart puro, y sale por la hoja
  # de compartir del telefono como los demas archivos. `printing` no hace
  # falta: desde el visor de PDF de cualquier telefono se imprime.
  pdf: ^3.13.0

  # --- Varios ------------------------------------------------------------
  intl: ^0.20.3
  uuid: ^4.6.0
  package_info_plus: ^9.0.1
  ota_update: ^7.1.0
  # Abrir la ficha de Play Store cuando la app se instalo desde ahi: esa copia
  # no se actualiza sola con ota_update (ver state/actualizacion.dart).
  url_launcher: ^6.3.2
  crypto: ^3.0.7

  # --- Camiones ----------------------------------------------------------
  # Leer el QR de vueltas pendientes que imprime SiriusFleet. Usa ML Kit del
  # telefono, sin red: el QR se escanea en el patio, donde la senal es poca.
  mobile_scanner: ^7.4.2

  # --- Voz ---------------------------------------------------------------
  # La voz de las indicaciones: "en 150 metros, gira a la derecha". Usa el
  # sintetizador del telefono, que funciona sin red si la voz en espanol esta
  # instalada. Para quien maneja con las manos en el volante, y para quien no
  # alcanza a leer la pantalla.
  flutter_tts: ^4.2.5
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Semilla offline: la app tiene que poder arrancar y mostrar la lista de
    # proyectos la primera vez, en un potrero, sin haber hablado nunca con el
    # backend.
    - assets/semilla/proyectos.json
    - assets/semilla/simbolos.json

    # Datos de predios: perimetro, vias y lotes. **Confidenciales**: no estan
    # en el repositorio, que es publico, y se regeneran con los scripts de
    # tools/ (ver assets/zonas/LEEME.md).
    #
    # Se declara la carpeta y no cada archivo a proposito: asi un clon sin los
    # datos compila igual, y la app marca el mapa del predio como no disponible
    # en vez de fallar al arrancar.
    - assets/zonas/

    # TODO(marca): traer de sirius_agro los PNG/SVG de marca y las Museo Slab.
    # Mientras no esten, declararlos hace fallar el build antes de compilar.


# Iconos de la app: `dart run flutter_launcher_icons` los regenera desde el logo.
# El adaptativo (Android 8+) usa el mismo PNG como frente, con el margen por
# defecto del 16%: sin el, el circulo azul de arriba a la derecha queda fuera
# de la mascara redonda del launcher y se corta.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/marca/sirius-geo-ruta-s-1024.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/marca/sirius-geo-ruta-s-1024.png
  min_sdk_android: 24
