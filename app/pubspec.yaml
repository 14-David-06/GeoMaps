name: geomaps
description: "Mapas georreferenciados offline: carga el plano del predio, ubicate en el sin senal, marca y mide"
publish_to: 'none'

version: 0.2.2+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Mapa -------------------------------------------------------------
  # flutter_map es raster. Se eligio sobre maplibre_gl porque superponer las
  # capas del usuario (el MBTiles que trajo topografia) sobre el satelite es
  # una linea de codigo, y porque no arrastra binarios nativos por plataforma.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # El mapa offline del usuario: un SQLite con las teselas adentro.
  # TODO(mapas-offline): reactivar al implementar la importacion de MBTiles.
  # flutter_map_mbtiles:
  # mbtiles:

  # Cache de las teselas que SI se bajan de internet (Esri, OSM). Permite
  # "descargar esta region" sobre el mapa base, que es distinto de importar
  # un MBTiles propio.
  # TODO(descarga-regiones): reactivar al implementar la descarga por area.
  # flutter_map_tile_caching:

  # Reproyeccion. Un plano de topografia colombiano llega en MAGNA-SIRGAS
  # (EPSG:3116, 9377...), no en WGS84.
  proj4dart: ^2.1.0

  # --- Datos ------------------------------------------------------------
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # --- Estado -----------------------------------------------------------
  flutter_riverpod: ^2.6.1

  # --- GPS --------------------------------------------------------------
  geolocator: ^13.0.2
  permission_handler: ^13.0.1
  # El trazado tiene que seguir grabando con la pantalla apagada y el telefono
  # en el bolsillo. Sin servicio en primer plano, Android mata el proceso a los
  # pocos minutos y el recorrido queda cortado sin aviso.
  flutter_foreground_task: ^9.1.0

  # --- Red --------------------------------------------------------------
  http: ^1.6.0
  connectivity_plus: ^7.3.1

  # --- Identidad ---------------------------------------------------------
  # Registro abierto con cuenta de Google. No hay SDK de proveedor de identidad:
  # la app obtiene el idToken de Google, lo cambia por un JWT nuestro en el
  # backend, y lo guarda cifrado.
  google_sign_in: ^6.2.2

  # El JWT propio va al Keystore de Android, no a SharedPreferences: un token
  # de 30 dias en texto plano es una sesion prestada a cualquiera que tenga el
  # telefono un minuto.
  flutter_secure_storage: ^9.2.2

  # --- Camara y archivos -------------------------------------------------
  camera: ^0.11.0
  image_picker: ^1.2.3
  # Elegir un archivo del telefono (el PDF de topografia que se importa como
  # capa). Es `file_selector` y no `file_picker`: el segundo sigue sin compilar
  # -8.x contra android-34, muy viejo para esta cadena; 11.x no publica la clase
  # Java que el registrant de plugins espera, comprobado de nuevo al construir
  # la importacion-. Este es del equipo de Flutter y compila limpio.
  file_selector: ^1.1.0
  # 12.x y no 13.x: share_plus 13 pide win32 ^6 y flutter_secure_storage pide
  # win32 ^5. El conflicto es de los plugins de Windows, no de Android, pero pub
  # resuelve para todas las plataformas a la vez.
  share_plus: ^12.0.2
  archive: ^4.0.9

  # --- Entregables -------------------------------------------------------
  pdf: ^3.13.0
  printing: ^5.15.0

  # --- Varios ------------------------------------------------------------
  intl: ^0.20.3
  uuid: ^4.6.0
  package_info_plus: ^9.0.1
  ota_update: ^7.1.0
  crypto: ^3.0.7
  image: ^4.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    # Semilla offline: la app tiene que poder arrancar y mostrar la lista de
    # proyectos la primera vez, en un potrero, sin haber hablado nunca con el
    # backend.
    - assets/semilla/proyectos.json
    - assets/semilla/simbolos.json

    # Datos de predios: perimetro, vias y lotes. **Confidenciales**: no estan
    # en el repositorio, que es publico, y se regeneran con los scripts de
    # tools/ (ver assets/zonas/LEEME.md).
    #
    # Se declara la carpeta y no cada archivo a proposito: asi un clon sin los
    # datos compila igual, y la app marca el mapa del predio como no disponible
    # en vez de fallar al arrancar.
    - assets/zonas/

    # TODO(marca): traer de sirius_agro los PNG/SVG de marca y las Museo Slab.
    # Mientras no esten, declararlos hace fallar el build antes de compilar.

